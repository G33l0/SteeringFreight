# Blueprint for a free preview deployment on Render.
#
# This is for showing the site to people before the real hosting and domain are
# in place. It is not how the site should run for a real customer: a free
# instance sleeps after fifteen minutes of inactivity and its disk is wiped on
# every restart, so shipments entered on it do not survive. Production goes on
# shared hosting or a VPS — README sections 28 to 31.
services:
  - type: web
    name: portlane-preview
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Portlane Shipping
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

      # Set these in the Render dashboard; they are secrets or account specific.
      - key: APP_KEY            # base64:... see README section 63
        sync: false
      - key: APP_URL            # https://your-service.onrender.com
        sync: false
      - key: ADMIN_EMAIL        # the first master admin
        sync: false
      - key: ADMIN_PASSWORD     # at least 8 characters; change it after signing in
        sync: false

      # Render terminates TLS at its load balancer, so the forwarded scheme and
      # client address have to be believed for rate limiting and the audit log
      # to record the visitor rather than the proxy.
      - key: TRUSTED_PROXIES
        value: "*"

      - key: SESSION_SECURE_COOKIE
        value: true

      # The disk is wiped on every restart, so the database is rebuilt and
      # refilled each time the service wakes up. Both stay off a real install.
      - key: SEED_ON_BOOT
        value: true
      - key: DEMO_DATA
        value: true

      # Nothing is actually sent from the preview; mail goes to the log.
      - key: MAIL_MAILER
        value: log
