<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img"
     aria-label="Container terminal with gantry cranes, stacked containers and a berthed vessel">
  <rect width="1200" height="500" fill="#eef2f5"/>
  <rect y="360" width="1200" height="140" fill="#dfe7ed"/>

  <!-- Cranes -->
  <g stroke="#2c5878" stroke-width="7" fill="none" stroke-linecap="square">
    <path d="M120 360V148h190v212M120 148H84l36-42h190l36 42h-36M215 148v66"/>
    <path d="M400 360V166h170v194M400 166h-32l32-38h170l32 38h-32M485 166v58"/>
    <path d="M660 360V150h190v210M660 150h-36l36-42h190l36 42h-36M755 150v64"/>
  </g>

  <!-- Container yard -->
  <g>
    <rect x="940" y="266" width="104" height="30" fill="#2c5878"/>
    <rect x="940" y="298" width="104" height="30" fill="#1d4160"/>
    <rect x="1052" y="298" width="104" height="30" fill="#6d90a8"/>
    <rect x="940" y="330" width="104" height="30" fill="#ab4c17"/>
    <rect x="1052" y="330" width="104" height="30" fill="#2c5878"/>
  </g>

  <!-- Quay -->
  <rect y="352" width="1200" height="10" fill="#2c5878"/>

  <!-- Vessel -->
  <g>
    <path d="M150 420h620l-46 58H196z" fill="#0c1f2e"/>
    <rect x="672" y="356" width="86" height="64" fill="#14304a"/>
    <g fill="#cfdce5">
      <rect x="686" y="372" width="16" height="12"/><rect x="712" y="372" width="16" height="12"/>
      <rect x="686" y="394" width="16" height="12"/><rect x="712" y="394" width="16" height="12"/>
    </g>
    <g>
      <rect x="186" y="390" width="70" height="28" fill="#ab4c17"/>
      <rect x="262" y="390" width="70" height="28" fill="#2c5878"/>
      <rect x="338" y="390" width="70" height="28" fill="#6d90a8"/>
      <rect x="414" y="390" width="70" height="28" fill="#2c5878"/>
      <rect x="490" y="390" width="70" height="28" fill="#ab4c17"/>
      <rect x="566" y="390" width="70" height="28" fill="#1d4160"/>
      <rect x="186" y="360" width="70" height="26" fill="#1d4160"/>
      <rect x="262" y="360" width="70" height="26" fill="#6d90a8"/>
      <rect x="338" y="360" width="70" height="26" fill="#2c5878"/>
      <rect x="414" y="360" width="70" height="26" fill="#1d4160"/>
      <rect x="490" y="360" width="70" height="26" fill="#2c5878"/>
    </g>
  </g>

  <g stroke="#a2bacb" stroke-width="5" stroke-linecap="round">
    <path d="M80 492h200M320 492h240M600 492h180M820 492h300"/>
  </g>
</svg>
