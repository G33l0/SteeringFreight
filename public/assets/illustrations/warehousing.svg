<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="Racked pallets in a warehouse with a forklift moving stock">
  <rect width="800" height="600" fill="#eef2f5"/>
  <rect y="470" width="800" height="130" fill="#e3eaef"/>

  <!-- Racking, left bay -->
  <g>
    <rect x="40" y="60" width="20" height="410" fill="#2c5878"/>
    <rect x="352" y="60" width="20" height="410" fill="#2c5878"/>
    <rect x="40" y="60" width="332" height="18" fill="#14304a"/>
    <rect x="40" y="196" width="332" height="18" fill="#14304a"/>
    <rect x="40" y="332" width="332" height="18" fill="#14304a"/>

    <rect x="72" y="96" width="126" height="100" fill="#6d90a8"/>
    <rect x="212" y="112" width="144" height="84" fill="#1d4160"/>
    <rect x="72" y="238" width="140" height="94" fill="#ab4c17"/>
    <rect x="226" y="252" width="130" height="80" fill="#2c5878"/>
    <rect x="72" y="378" width="116" height="92" fill="#1d4160"/>
    <rect x="202" y="392" width="154" height="78" fill="#6d90a8"/>
  </g>

  <!-- Racking, right bay -->
  <g>
    <rect x="448" y="60" width="20" height="300" fill="#2c5878"/>
    <rect x="740" y="60" width="20" height="300" fill="#2c5878"/>
    <rect x="448" y="60" width="312" height="18" fill="#14304a"/>
    <rect x="448" y="196" width="312" height="18" fill="#14304a"/>
    <rect x="480" y="96" width="140" height="100" fill="#2c5878"/>
    <rect x="634" y="116" width="112" height="80" fill="#ab4c17"/>
    <rect x="480" y="238" width="118" height="94" fill="#6d90a8"/>
  </g>

  <!-- Forklift -->
  <g>
    <rect x="450" y="372" width="150" height="76" rx="8" fill="#14304a"/>
    <rect x="486" y="330" width="76" height="44" fill="#2c5878"/>
    <rect x="612" y="296" width="16" height="152" fill="#0c1f2e"/>
    <rect x="628" y="430" width="86" height="16" fill="#0c1f2e"/>
    <rect x="632" y="358" width="82" height="66" fill="#ab4c17"/>
    <circle cx="488" cy="462" r="28" fill="#0c1f2e"/>
    <circle cx="572" cy="462" r="28" fill="#0c1f2e"/>
    <circle cx="488" cy="462" r="10" fill="#e3eaef"/>
    <circle cx="572" cy="462" r="10" fill="#e3eaef"/>
  </g>
</svg>
