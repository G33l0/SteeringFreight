<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="Cargo being checked and secured before loading">
  <rect width="800" height="600" fill="#eef2f5"/>
  <rect y="470" width="800" height="130" fill="#dfe7ed"/>

  <!-- Reach stacker arm holding a container -->
  <g stroke="#2c5878" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M96 452l180-200"/>
  </g>
  <rect x="60" y="424" width="130" height="52" rx="6" fill="#14304a"/>
  <circle cx="96" cy="490" r="24" fill="#0c1f2e"/>
  <circle cx="164" cy="490" r="24" fill="#0c1f2e"/>

  <g>
    <rect x="262" y="196" width="290" height="110" fill="#ab4c17"/>
    <g stroke="#8f3d12" stroke-width="7">
      <path d="M300 196v110M340 196v110M380 196v110M420 196v110M460 196v110M500 196v110"/>
    </g>
    <rect x="262" y="196" width="290" height="14" fill="#8f3d12"/>
    <rect x="262" y="292" width="290" height="14" fill="#8f3d12"/>
  </g>

  <!-- Checked pallets -->
  <g>
    <rect x="580" y="330" width="150" height="96" fill="#6d90a8"/>
    <rect x="580" y="426" width="150" height="14" fill="#2c5878"/>
    <rect x="596" y="356" width="60" height="10" rx="5" fill="#eef2f5"/>
    <rect x="596" y="380" width="90" height="10" rx="5" fill="#eef2f5"/>

    <rect x="580" y="452" width="150" height="14" fill="#1d4160"/>
  </g>

  <!-- Clipboard -->
  <g>
    <rect x="330" y="380" width="150" height="190" rx="8" fill="#ffffff" stroke="#cfdce5" stroke-width="4"/>
    <rect x="378" y="368" width="54" height="24" rx="6" fill="#2c5878"/>
    <g fill="#a2bacb">
      <rect x="356" y="426" width="98" height="10" rx="5"/>
      <rect x="356" y="454" width="72" height="10" rx="5"/>
      <rect x="356" y="482" width="98" height="10" rx="5"/>
      <rect x="356" y="510" width="60" height="10" rx="5"/>
    </g>
    <path d="M352 538l14 14 28-32" stroke="#ab4c17" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
