<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="Consignments from several suppliers combined into one container">
  <rect width="800" height="600" fill="#eef2f5"/>
  <rect y="470" width="800" height="130" fill="#e3eaef"/>

  <!-- Incoming consignments -->
  <g>
    <rect x="36" y="96" width="140" height="92" fill="#6d90a8"/>
    <rect x="36" y="188" width="140" height="16" fill="#2c5878"/>
    <rect x="36" y="256" width="140" height="92" fill="#2c5878"/>
    <rect x="36" y="348" width="140" height="16" fill="#1d4160"/>
    <rect x="36" y="416" width="140" height="92" fill="#ab4c17"/>
    <rect x="36" y="508" width="140" height="16" fill="#8f3d12"/>
  </g>

  <!-- Merge -->
  <g stroke="#a2bacb" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M204 142c104 0 104 158 164 158"/>
    <path d="M204 302h164"/>
    <path d="M204 462c104 0 104-158 164-158"/>
  </g>
  <path d="M366 280l40 22-40 22z" fill="#ab4c17"/>

  <!-- Container -->
  <g>
    <rect x="424" y="160" width="344" height="286" fill="#14304a"/>
    <g stroke="#2c5878" stroke-width="10">
      <path d="M470 160v286M516 160v286M562 160v286M608 160v286M654 160v286M700 160v286"/>
    </g>
    <rect x="424" y="160" width="344" height="24" fill="#0c1f2e"/>
    <rect x="424" y="422" width="344" height="24" fill="#0c1f2e"/>
    <rect x="410" y="446" width="372" height="18" fill="#2c5878"/>
    <rect x="452" y="464" width="44" height="36" fill="#1d4160"/>
    <rect x="696" y="464" width="44" height="36" fill="#1d4160"/>
  </g>
</svg>
