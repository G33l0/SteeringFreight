<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="A customs entry being checked and stamped at the port gate">
  <rect width="800" height="600" fill="#eef2f5"/>
  <rect y="452" width="800" height="148" fill="#e3eaef"/>

  <!-- Gate frame -->
  <g>
    <rect x="40" y="96" width="40" height="356" fill="#2c5878"/>
    <rect x="720" y="96" width="40" height="356" fill="#2c5878"/>
    <rect x="40" y="60" width="720" height="40" fill="#14304a"/>
    <rect x="336" y="112" width="128" height="12" fill="#ab4c17"/>
  </g>

  <!-- Barrier -->
  <g>
    <rect x="104" y="330" width="30" height="122" fill="#14304a"/>
    <g transform="rotate(-30 119 338)">
      <rect x="119" y="322" width="270" height="24" fill="#ffffff" stroke="#0c1f2e" stroke-width="5"/>
      <rect x="152" y="322" width="46" height="24" fill="#ab4c17"/>
      <rect x="244" y="322" width="46" height="24" fill="#ab4c17"/>
      <rect x="336" y="322" width="46" height="24" fill="#ab4c17"/>
    </g>
  </g>

  <!-- Entry document -->
  <g>
    <rect x="356" y="150" width="330" height="410" rx="8" fill="#ffffff" stroke="#cfdce5" stroke-width="6"/>
    <rect x="396" y="192" width="120" height="18" rx="9" fill="#2c5878"/>
    <g fill="#a2bacb">
      <rect x="396" y="240" width="248" height="16" rx="8"/>
      <rect x="396" y="278" width="196" height="16" rx="8"/>
      <rect x="396" y="316" width="248" height="16" rx="8"/>
      <rect x="396" y="354" width="150" height="16" rx="8"/>
    </g>
    <g transform="rotate(-11 520 466)">
      <rect x="424" y="412" width="196" height="108" rx="10" fill="none" stroke="#ab4c17" stroke-width="9"/>
      <rect x="462" y="446" width="120" height="14" rx="7" fill="#ab4c17"/>
      <rect x="482" y="476" width="80" height="14" rx="7" fill="#ab4c17"/>
    </g>
  </g>
</svg>
