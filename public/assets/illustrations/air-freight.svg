<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="A freighter aircraft on the apron being loaded with air cargo pallets">
  <rect width="800" height="600" fill="#eef2f5"/>
  <rect y="436" width="800" height="164" fill="#e3eaef"/>

  <!-- Aircraft -->
  <g>
    <path d="M40 336c0-70 58-112 150-112h330c92 0 168 30 224 76l46 38c10 8 6 22-8 22H208c-92 0-168-38-168-24z" fill="#14304a"/>
    <path d="M40 336c0-70 58-112 150-112h74l-30 236h-26c-92 0-168-38-168-124z" fill="#0c1f2e"/>
    <path d="M300 224h96l-24-146h-52z" fill="#2c5878"/>
    <path d="M470 300l180-14-124 106h-102z" fill="#2c5878"/>
    <g fill="#cfdce5">
      <rect x="330" y="270" width="24" height="22"/><rect x="382" y="270" width="24" height="22"/>
      <rect x="434" y="270" width="24" height="22"/><rect x="486" y="270" width="24" height="22"/>
      <rect x="538" y="270" width="24" height="22"/>
    </g>
    <!-- raised nose door -->
    <path d="M40 336c0-46 26-78 68-96l10 34-36 62z" fill="#ab4c17"/>
