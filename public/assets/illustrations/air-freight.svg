    <rect x="512" y="446" width="60" height="30" fill="#6d90a8"/>
    <rect x="626" y="446" width="60" height="30" fill="#6d90a8"/>
    <rect x="474" y="348" width="120" height="76" fill="#ab4c17"/>
    <rect x="606" y="348" width="120" height="76" fill="#1d4160"/>
  </g>

  <!-- Ground pallets -->
  <g>
    <rect x="86" y="470" width="140" height="62" fill="#2c5878"/>
    <rect x="86" y="532" width="140" height="16" fill="#1d4160"/>
    <rect x="252" y="492" width="110" height="40" fill="#6d90a8"/>
    <rect x="252" y="532" width="110" height="16" fill="#1d4160"/>
  </g>

  <g stroke="#a2bacb" stroke-width="8" stroke-linecap="round">
    <path d="M60 578h200M420 578h320"/>
