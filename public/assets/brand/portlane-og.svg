<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Portlane Shipping — freight handled with care, from origin to destination">
  <rect width="1200" height="630" fill="#0c1f2e"/>

  <!-- Terminal silhouette -->
  <g opacity="0.4" transform="translate(70 66)">
    <g stroke="#2c5878" stroke-width="6" fill="none" stroke-linecap="square">
      <path d="M700 470V300h150v170M700 300h-30l30-36h150l30 36h-30M765 300v54"/>
      <path d="M940 470V318h132v152M940 318h-26l26-32h132l26 32h-26M1000 318v50"/>
    </g>
    <rect x="640" y="470" width="560" height="8" fill="#2c5878"/>
    <path d="M660 520h480l-38 48H698z" fill="#07131e"/>
    <rect x="1052" y="470" width="72" height="50" fill="#14304a"/>
    <g>
      <rect x="690" y="492" width="58" height="24" fill="#ab4c17"/>
      <rect x="754" y="492" width="58" height="24" fill="#2c5878"/>
      <rect x="818" y="492" width="58" height="24" fill="#446e8c"/>
      <rect x="882" y="492" width="58" height="24" fill="#2c5878"/>
      <rect x="946" y="492" width="58" height="24" fill="#ab4c17"/>
      <rect x="690" y="466" width="58" height="22" fill="#1d4160"/>
      <rect x="754" y="466" width="58" height="22" fill="#446e8c"/>
      <rect x="818" y="466" width="58" height="22" fill="#2c5878"/>
    </g>
  </g>

  <!-- Logo -->
  <g transform="translate(88 92) scale(1.5)">
    <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="9" y="10" width="17" height="6" rx="1" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M9 19h16.5l5 3.5-5 3.5H9z" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="9" y="29" width="12" height="6" rx="1" fill="#c2631f"/>
  </g>
  <text x="164" y="128" font-family="'IBM Plex Sans','Inter',Arial,sans-serif" font-size="34" letter-spacing="-0.4">
    <tspan font-weight="600" fill="#ffffff">Portlane</tspan><tspan font-weight="400" fill="#a2bacb"> Shipping</tspan>
  </text>

  <text x="88" y="290" font-family="'Inter',Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#c2631f">
    FREIGHT FORWARDING AND CUSTOMS BROKERAGE
  </text>
  <text x="88" y="368" font-family="'IBM Plex Sans','Inter',Arial,sans-serif" font-size="54" font-weight="600" fill="#ffffff" letter-spacing="-1">
    Freight handled with care,
  </text>
  <text x="88" y="432" font-family="'IBM Plex Sans','Inter',Arial,sans-serif" font-size="54" font-weight="600" fill="#ffffff" letter-spacing="-1">
    from origin to destination.
  </text>
  <text x="88" y="500" font-family="'Inter',Arial,sans-serif" font-size="24" fill="#a2bacb">
    Sea and air freight, customs clearance and delivery.
  </text>
</svg>
